name: Native Core M1 Probe
on:
  push:
    branches: ["codex/native-rust-m0-m1"]
    paths: ["native/**", ".github/workflows/native-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-kotlin-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        working-directory: native
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Test core and generate actual bindings
        run: bash native/scripts/check.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
      - name: Kotlin to real Rust shared-library tests (JVM, not Android device)
        run: gradle -p native/tests/kotlin --no-daemon test
      - name: Compile Android arm64 native library (not app or device test)
        working-directory: native
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$linker" || { echo "Android NDK linker unavailable"; exit 2; }
          cat "$ndk/source.properties"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          cargo build --release --lib -p vcp-mobile-native-core --target aarch64-linux-android
  rust-swift-ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        working-directory: native
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Test core and generate actual bindings
        run: bash native/scripts/check.sh
      - name: Swift to real Rust shared-library tests (macOS, not iOS simulator)
        run: bash native/tests/swift/run.sh
      - name: Compile iOS device and simulator Rust libraries (not app tests)
        working-directory: native
        run: |
          xcodebuild -version
          xcrun swiftc --version
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build --release --lib -p vcp-mobile-native-core --target aarch64-apple-ios
          cargo build --release --lib -p vcp-mobile-native-core --target aarch64-apple-ios-sim
